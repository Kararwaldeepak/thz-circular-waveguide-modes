[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thz-circular-waveguide-modes"
version = "1.0.0"
description = "Semi-analytical Gaussian-beam coupling to circular copper THz waveguide modes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Deepak Kararwal"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8"
]

[project.scripts]
thz-waveguide = "thz_waveguide.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
